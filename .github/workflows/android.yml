name: Build Soul Warriors 3D APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android build environment
        shell: bash
        run: |
          apt-get update
          apt-get install -y fontconfig

          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/lib/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          java -version
          test -d "$ANDROID_HOME" || {
            echo "Android SDK directory not found: $ANDROID_HOME"
            exit 1
          }

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"

          wget -q --show-progress \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -O /tmp/godot-templates.tpz

          unzip -o /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"

          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          godot --headless --editor --path godot_game \
            --quit

      - name: Validate project
        run: godot --headless --path godot_game --editor --quit

      - name: Run game scene smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot_game --quit-after 10 2>&1 | tee /tmp/game-test.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/game-test.log; then
            echo "Game scene test detected a script error."
            exit 1
          fi

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          mkdir -p godot_game/build
          godot --headless --path godot_game \
            --export-debug "Android" build/SoulWarriors3D.apk
          test -s godot_game/build/SoulWarriors3D.apk
          unzip -t godot_game/build/SoulWarriors3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulWarriors3D-APK
          path: godot_game/build/SoulWarriors3D.apk
          if-no-files-found: error
